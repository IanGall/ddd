name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 单次根构建覆盖全部模块，避免 std / gateway 被重复构建。
      # -Pcoverage-gate 激活各父 pom 的分档单服务覆盖率门槛（ddd-base / std / gateway）。
      # 分布式 E2E 覆盖率不在 CI 运行：需要 Nacos、Redis、MySQL 与真实服务，用 coverage-e2e.sh 本地或专用流水线执行。
      - name: 构建并验证（含单服务覆盖率门槛）
        run: mvn -B install -Pcoverage-gate

      - name: 上传单服务覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore
