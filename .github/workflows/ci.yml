name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 构建并安装 ddd-base（含覆盖率门槛）
        run: mvn -B -f ddd-base/pom.xml install -Pcoverage-gate

      - name: 构建并安装标准服务
        run: mvn -B -f ian-ddd-archetype-std/pom.xml install

      - name: 构建并验证网关
        run: mvn -B -f ian-ddd-gateway/pom.xml verify

      - name: 上传 JaCoCo 覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore
