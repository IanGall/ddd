name: CI

on:
  push:
    branches: [ '**' ]
  pull_request:

# 同一分支的新提交取消进行中的旧构建，避免重复消耗
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 单次根构建覆盖全部模块，避免 auth / gateway 被重复构建。
      # -Pcoverage-gate 激活各父 pom 的分档单服务覆盖率门槛（ddd-base / auth / gateway）。
      # 分布式 E2E 覆盖率不在 CI 运行：需要 Nacos、Redis、MySQL 与真实服务，用 coverage-e2e.sh 本地或专用流水线执行。
      - name: 构建并验证（含单服务覆盖率门槛）
        run: mvn -B install -Pcoverage-gate

      - name: 上传单服务覆盖率报告
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jacoco-report
          path: '**/target/site/jacoco/'
          if-no-files-found: ignore

      # ddd main 变更后立即触发 ddd-scaffold 重新验证骨架，缩短兼容性问题的暴露窗口。
      # 需要在 ddd 仓库配置 secret SCAFFOLD_DISPATCH_TOKEN（对 ddd-scaffold 有 repo 权限的 PAT）；
      # 未配置时跳过，scaffold CI 的每日跟随 main 定时任务仍可兜底。
      - name: 通知 ddd-scaffold 验证骨架兼容性
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DISPATCH_TOKEN: ${{ secrets.SCAFFOLD_DISPATCH_TOKEN }}
        run: |
          if [ -z "${DISPATCH_TOKEN}" ]; then
            echo "未配置 SCAFFOLD_DISPATCH_TOKEN，跳过骨架触发（依赖 scaffold CI 的每日定时任务）"
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/IanGall/ddd-scaffold/dispatches \
            -d '{"event_type":"ddd-updated"}'
