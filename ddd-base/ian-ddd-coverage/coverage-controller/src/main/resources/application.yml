server:
  port: 8099
  # 仅本机可访问：覆盖率工具链（E2E 脚本、本地浏览报告）不需要对外暴露，
  # 避免源码级 HTML 报告被同网段读取。
  address: 127.0.0.1

spring:
  application:
    name: coverage-controller
  main:
    banner-mode: off

logging:
  level:
    cn.iantech.coverage: INFO

coverage:
  agents:
    # 端口分配为工程约定：gateway 固定 6300，其余服务依次递增。
    # 各被测服务启动时通过 -javaagent 注入 jacocoagent，sessionid 需与 name 一致。
    - name: gateway
      host: 127.0.0.1
      port: 6300
    - name: auth
      host: 127.0.0.1
      port: 6301
  reports:
    - name: gateway
      classes-directories:
        # gateway-core 承载认证过滤器/渠道验签/异常翻译等安全关键类，与 gateway-app 同 JVM 采集，
        # 必须一并纳入并集报告，否则并集口径失真、40% 目标被高估。
        - ian-ddd-gateway/gateway-core/target/classes
        - ian-ddd-gateway/gateway-app/target/classes
      source-directories:
        - ian-ddd-gateway/gateway-core/src/main/java
        - ian-ddd-gateway/gateway-app/src/main/java
    - name: auth
      classes-directories:
        - ian-ddd-auth/ian-ddd-auth-trigger/target/classes
        - ian-ddd-auth/ian-ddd-auth-domain/target/classes
        - ian-ddd-auth/ian-ddd-auth-infrastructure/target/classes
        - ian-ddd-api/ian-ddd-api-internal/ian-ddd-auth-api/target/classes
      source-directories:
        - ian-ddd-auth/ian-ddd-auth-trigger/src/main/java
        - ian-ddd-auth/ian-ddd-auth-domain/src/main/java
        - ian-ddd-auth/ian-ddd-auth-infrastructure/src/main/java
        - ian-ddd-api/ian-ddd-api-internal/ian-ddd-auth-api/src/main/java
