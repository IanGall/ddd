# 认证服务 k8s 部署清单。
#
# 前置：镜像已构建（在 ian-ddd-auth-boot 下执行 bash build.sh，镜像名 system/ian-ddd-auth-boot:1.0-SNAPSHOT）。
# 凭证：不写在清单里，先用 kubectl create secret 创建 ian-ddd-auth-secret（见同目录 README.md）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ian-ddd-auth
  labels:
    app.kubernetes.io/name: ian-ddd-auth
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      # 与 PDB minAvailable=1 配合：先起新副本、ready 后再摘旧副本
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: ian-ddd-auth
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ian-ddd-auth
    spec:
      # preStop(10s) + Spring 关闭 + Dubbo 反注册 + 余量
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          # 尽量把副本分散到不同节点；单节点集群下只是尽力而为，不阻塞调度
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: ian-ddd-auth
      containers:
        - name: auth
          image: system/ian-ddd-auth-boot:1.0-SNAPSHOT
          # SNAPSHOT 是可移动 tag：生产请改为不可变 tag 或 digest，否则节点可能一直用旧镜像
          imagePullPolicy: IfNotPresent
          ports:
            # 认证服务运行期只有 Dubbo Provider，没有 servlet 容器（spring-boot-starter-web 仅在 -Phttp 下引入，默认不激活），
            # 因此这里只暴露 Dubbo 端口，探针也探它。不要按 application.yml 的 server.port: 8091 加 HTTP 端口。
            - name: dubbo
              containerPort: 20880
              protocol: TCP
          envFrom:
            # 顺序有意义：同名键以后者为准，因此 Secret 必须在 ConfigMap 之后
            - configMapRef:
                name: ian-ddd-auth-config
            - secretRef:
                name: ian-ddd-auth-secret
          env:
            - name: JAVA_OPTS
              # -Duser.home=/tmp 是必需的：容器以无 passwd 条目的 uid 运行，user.home 为空串，Dubbo 元数据缓存会写
              # /.dubbo、Nacos 客户端日志会写 /logs/nacos，只读根文件系统下直接启动失败（实测报
              # Invalid service store file /.dubbo/...）。把 user.home 指到已挂 emptyDir 的 /tmp 即可同时解决两处。
              value: >-
                -XX:MaxRAMPercentage=75.0
                -XX:+UseG1GC
                -XX:+ExitOnOutOfMemoryError
                -Duser.home=/tmp
                -Ddubbo.registry.file=/tmp/dubbo-registry.cache
          resources:
            requests:
              cpu: "300m"
              memory: 768Mi
            limits:
              cpu: "1500m"
              memory: 1536Mi
          # 三探针都探 Dubbo 端口：该端口在 ServiceBean 导出时才绑定，即 consumer 需要它 ready 的时刻。
          # 已知局限：端口就绪不等于 MySQL/Redis/Nacos 就绪，依赖侧由 dubbo.consumer.check=false + 注册中心推送补偿。
          startupProbe:
            tcpSocket:
              port: dubbo
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 36
          readinessProbe:
            tcpSocket:
              port: dubbo
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            tcpSocket:
              port: dubbo
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          lifecycle:
            preStop:
              # 等 Endpoints 摘除传播完再发 SIGTERM（镜像内没有 curl，只能用 sleep）
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # WORKDIR /app（见 Dockerfile），logback 按相对路径写 ./data/log
            - name: logs
              mountPath: /app/data
            # Dubbo 默认往 ${user.home}/.dubbo 写注册中心缓存，只读根文件系统下会反复告警
            - name: tmp
              mountPath: /tmp
      volumes:
        # emptyDir 随 Pod 销毁，仅用于让日志/临时文件可写；日志采集请走容器 stdout
        - name: logs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
