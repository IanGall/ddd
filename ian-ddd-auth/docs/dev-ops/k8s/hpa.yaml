# 认证服务水平扩缩容。
#
# 扩容硬上限来自 ID 生成器的 WorkerId 池：一个实例只租用一个 WorkerId（实例内四个业务共用它），
# 池容量为 2^worker-id-bit-length = 1024，因此副本数上限是 1024，与业务数量无关。
# 超限时新副本拿不到 WorkerId 租约、启动直接失败。
# 这里取 8，并为缩容留 300s 稳定窗：频繁伸缩会让每个副本反复续租 / 释放 WorkerId，代价高于收益。
#
# 注意：本机 OrbStack 集群没有 metrics-server，HPA 会一直显示 <unknown> 且不会伸缩；
# 生产集群需自行确认 metrics-server 已就绪。
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ian-ddd-auth
  labels:
    app.kubernetes.io/name: ian-ddd-auth
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: ian-ddd-auth
  minReplicas: 2
  maxReplicas: 8
  metrics:
    # Utilization 口径 = 实际用量 / requests，因此 Deployment 必须设置 requests.cpu，否则指标为 unknown
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 50
          periodSeconds: 60
