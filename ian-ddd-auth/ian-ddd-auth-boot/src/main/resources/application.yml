spring:
  application:
    name: ian-ddd-auth-boot
  profiles:
    active: dev
    # 自动化测试请按「dev,autotest」顺序激活（见 application-autotest.yml）：
    # 多个 profile 同时激活时后者优先，autotest 放最后才能覆盖 dev 的 MySQL/Redis 为测试库。

dubbo:
  application:
    qos-enable: ${DUBBO_QOS_ENABLED:false}
    # 元数据服务与业务服务保持同协议：不显式指定时 Dubbo 内部的兜底值是 tri
    metadata-service-protocol: dubbo

# Auth 服务 opaque Token 生命周期（单位：秒）
auth:
  security:
    session:
      access-token-timeout: ${AUTH_ACCESS_TOKEN_TIMEOUT:9000}
      refresh-token-timeout: ${AUTH_REFRESH_TOKEN_TIMEOUT:2592000}

# Worker ID 池是服务级的：命名空间未显式配置时取 spring.application.name（此处 ian-ddd-auth-boot），
# 因此不同服务天然落在各自的池里，不会互相抢占 Worker ID。
# 可用环境变量 DDD_ID_GENERATOR_NAMESPACE 覆盖，但**变更它的值必须先停机**：
# 新旧命名空间是两个互不知晓的池，滚动发布期间两边可能各自租到同一个 Worker ID 而重号。
# businesses 只支持在 YAML 中声明（映射键没有单一属性名，无法用环境变量覆盖），值为该业务的序列位宽。
# 划界判据是「ID 是否流入同一个字段」：rbac_account / rbac_user / customer_user 的 ID 都会流进
# AuthSession.userId 并由 userType 分派，因此合并为一个 identity 业务，保证该字段在服务内唯一。
# channel_data_scope 已改为数据库自增，不需要业务声明。
ddd:
  id-generator:
    worker-id-bit-length: 10
    businesses:
      identity: 12
      auth-session: 12
      channel-credential: 12
      user-order: 12
