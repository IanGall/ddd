server:
  port: 8091

channel:
  security:
    encryption:
      key-id: ${CHANNEL_ENCRYPTION_KEY_ID}
      master-key: ${CHANNEL_ENCRYPTION_MASTER_KEY}

platform:
  security:
    admin-token: ${PLATFORM_ADMIN_TOKEN}

# 生产数据库及中间件连接必须由部署环境注入，禁止在代码库中保存地址或凭据。
spring:
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    # placeholder-type=environment：ShardingSphere 按环境变量渲染 YAML 中的 $${VAR::默认值} 占位符
    url: jdbc:shardingsphere:classpath:sharding/sharding-jdbc-prod.yaml?placeholder-type=environment
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: ${REDIS_DATABASE:0}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ian-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  application:
    name: ian-ddd-auth
    version: 1.0.0
  registry:
    id: nacos-registry
    address: ${DUBBO_REGISTRY_ADDRESS}
    username: ${DUBBO_REGISTRY_USERNAME}
    password: ${DUBBO_REGISTRY_PASSWORD}
    parameters:
      enable-empty-protection: true
  protocol:
    name: tri
    port: ${TRIPLE_PROTOCOL_PORT:50051}
    ssl-enabled: false
  scan:
    base-packages: cn.iantech.trigger.rpc

# Kafka
kafka:
  enabled: ${KAFKA_ENABLED:true}
  topic: ${KAFKA_TOPIC:ian-mq}

# xxl-job https://www.xuxueli.com/xxl-job/
xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:false}
    accessToken: ${XXL_JOB_ACCESS_TOKEN}
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES}
    executor:
      address:
      appname: xxl-job-executor-sample
      ip:
      port: 9999
      logpath: ./data/applogs/xxl-job/jobhandler
      logretentiondays: 30

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml
