# 生产分片配置模板：路由规则与 dev/autotest 一致，物理库地址、库名与凭证全部由部署环境注入。
#
# 数据源地址/库名/凭证使用 $${VAR} 占位符，由 JDBC URL 的 ?placeholder-type=environment 触发环境变量渲染。
# 敏感项刻意**不给默认值**：漏配时直接以配置错误暴露，而不是拼出 jdbc:mysql://:3306/ 这类畸形 URL，
# 更不能退化为空账号/空口令连库。仅非敏感的端口保留 3306 默认值。
# 必须注入：MYSQL_HOST、MYSQL_DATABASE_00、MYSQL_DATABASE_01、MYSQL_DATABASE_RBAC、MYSQL_USERNAME、MYSQL_PASSWORD。
mode:
  # 运行模式类型。可选配置：内存模式 Memory、单机模式 Standalone、集群模式 Cluster - 目前为单机模式
  type: Standalone

dataSources:
  ds_0:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://$${MYSQL_HOST}:$${MYSQL_PORT::3306}/$${MYSQL_DATABASE_00}?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=false&connectTimeout=5000&socketTimeout=5000&tcpKeepAlive=true
    username: "$${MYSQL_USERNAME}"
    password: "$${MYSQL_PASSWORD}"
    connectionTimeoutMilliseconds: 30000
    idleTimeoutMilliseconds: 60000
    maxLifetimeMilliseconds: 1800000
    maxPoolSize: 15
    minPoolSize: 5

  ds_1:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://$${MYSQL_HOST}:$${MYSQL_PORT::3306}/$${MYSQL_DATABASE_01}?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=false&connectTimeout=5000&socketTimeout=5000&tcpKeepAlive=true
    username: "$${MYSQL_USERNAME}"
    password: "$${MYSQL_PASSWORD}"
    connectionTimeoutMilliseconds: 30000
    idleTimeoutMilliseconds: 60000
    maxLifetimeMilliseconds: 1800000
    maxPoolSize: 15
    minPoolSize: 5

  ds_rbac:
    dataSourceClassName: com.zaxxer.hikari.HikariDataSource
    driverClassName: com.mysql.cj.jdbc.Driver
    jdbcUrl: jdbc:mysql://$${MYSQL_HOST}:$${MYSQL_PORT::3306}/$${MYSQL_DATABASE_RBAC}?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=false&connectTimeout=5000&socketTimeout=5000&tcpKeepAlive=true
    username: "$${MYSQL_USERNAME}"
    password: "$${MYSQL_PASSWORD}"
    connectionTimeoutMilliseconds: 30000
    idleTimeoutMilliseconds: 60000
    maxLifetimeMilliseconds: 1800000
    maxPoolSize: 15
    minPoolSize: 5

rules:
  - !SHARDING
    # 库的路由
    defaultDatabaseStrategy:
      standard:
        shardingColumn: user_id
        shardingAlgorithmName: database_inline
    # 表的路由
    tables:
      user_order:
        actualDataNodes: ds_$->{0..1}.user_order_$->{0..3}
        tableStrategy:
          standard:
            shardingColumn: user_id
            shardingAlgorithmName: user_order_inline
    # 路由算法
    shardingAlgorithms:
      # 库-路由算法 2是两个库，库的数量。库的数量用哈希模2来计算。
      database_inline:
        type: INLINE
        props:
          algorithm-expression: ds_$->{Math.abs(user_id.hashCode()) % 2}

      # 表-路由算法 4是一个库里，表的数量。4 - 1 为了获得 011 这样的二进制值。
      user_order_inline:
        type: INLINE
        props:
          algorithm-expression: user_order_$->{(user_id.hashCode() ^ (user_id.hashCode()) >>> 16) & (4 - 1)}
  - !SINGLE
    tables:
      - ds_rbac.*

props:
  # 生产禁止打印 SQL：日志内容包含逻辑 SQL、真实 SQL 与参数，会泄露业务数据
  sql-show: false
  sql-simple: false
  # 用于设置任务处理线程池的大小。每个 ShardingSphereDataSource 使用一个独立的线程池，同一个 JVM 的不同数据源不共享线程池。
  executor-size: 20
  # 查询请求在每个数据库实例中所能使用的最大连接数。1
  max-connections-size-per-query: 1
  # 在程序启动和更新时，是否检查分片元数据的结构一致性。
  check-table-metadata-enabled: false
  # 在程序启动和更新时，是否检查重复表。false
  check-duplicate-table-enabled: false
