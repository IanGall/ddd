spring:
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${RBAC_TEST_MYSQL_HOST:127.0.0.1}:${RBAC_TEST_MYSQL_PORT:3306}/${RBAC_TEST_MYSQL_DATABASE:ddd_rbac_test}?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=10000&socketTimeout=60000&tcpKeepAlive=true
    username: ${RBAC_TEST_MYSQL_USERNAME:root}
    password: ${RBAC_TEST_MYSQL_PASSWORD}
  main:
    allow-bean-definition-overriding: true
  sql:
    init:
      mode: never
  autoconfigure:
    exclude:
      - org.redisson.spring.starter.RedissonAutoConfigurationV2
      - org.redisson.spring.starter.RedissonAutoConfigurationV4

kafka:
  enabled: false

# 测试专用占位值：仅为让渠道加密与平台开户相关 Bean 完成装配，不参与真实加解密链路。
channel:
  security:
    encryption:
      key-id: test-key-v1
      master-key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

platform:
  security:
    admin-token: test-only-token

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  # 与 application-dev.yml 保持一致；此前指向不存在的 mybatis-config.xml 会导致上下文启动失败
  configuration:
    map-underscore-to-camel-case: true

dubbo:
  # 测试不需要对外暴露 RPC：不导出服务、不注册，只为 @EnableDubbo 提供 dubbo 协议配置。
  # 必须 provider.export=false——同一 JVM 内多个测试上下文并存时，重复导出同一服务路径会直接失败。
  registry:
    address: N/A
  provider:
    export: false
  protocol:
    id: dubbo
    name: dubbo
    port: -1

xxl:
  job:
    admin:
      addresses: http://127.0.0.1:18080/xxl-job-admin
    accessToken: test_token
    executor:
      appname: rbac-mysql-test
      address:
      ip: 127.0.0.1
      port: 19999
      logpath: ./target/xxl-job/logs
      logretentiondays: 3

logging:
  level:
    root: info
    cn.iantech: debug
    org.mybatis: debug
    org.apache.ibatis: debug
