server:
  port: 8091

channel:
  security:
    encryption:
      key-id: ${CHANNEL_ENCRYPTION_KEY_ID:dev-key-v1}
      master-key: ${CHANNEL_ENCRYPTION_MASTER_KEY:AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=}

# 仅本地 dev 使用明文默认值；生产环境必须通过 PLATFORM_ADMIN_TOKEN 注入。
platform:
  security:
    admin-token: ${PLATFORM_ADMIN_TOKEN:__REMOVED__}

# 数据库配置 - sharding-jdbc 分库分表
spring:
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:__REMOVED__}
      database: ${REDIS_DATABASE:0}
  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:sharding/sharding-jdbc-dev.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:ian-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

mybatis:
  mapper-locations: classpath:/mybatis/mapper/*.xml
  # 显式走 Spring Boot 配置绑定；此前 config-location 指向空 XML 会吞掉 mybatis.* 配置
  configuration:
    map-underscore-to-camel-case: true

# Dubbo
dubbo:
  application:
    name: ian-frame-archetype-std
    version: 1.0.0
  registry:
    id: nacos-registry
    address: ${DUBBO_REGISTRY_ADDRESS:nacos://127.0.0.1:8848}
    username: ${DUBBO_REGISTRY_USERNAME:nacos}
    password: ${DUBBO_REGISTRY_PASSWORD:__REMOVED__}
    parameters:
      enable-empty-protection: true
  protocol:
    name: tri
    port: ${TRIPLE_PROTOCOL_PORT:50051}
    ssl-enabled: false
  scan:
    base-packages: cn.iantech.trigger.rpc

# Kafka
kafka:
  enabled: ${KAFKA_ENABLED:true}
  topic: ${KAFKA_TOPIC:ian-mq}

# xxl-job https://www.xuxueli.com/xxl-job/#%E6%AD%A5%E9%AA%A4%E4%B8%80%EF%BC%9A%E8%B0%83%E5%BA%A6%E4%B8%AD%E5%BF%83%E9%85%8D%E7%BD%AE%EF%BC%9A
xxl:
  job:
    enabled: ${XXL_JOB_ENABLED:false}
    # 验证信息 官网Bug https://github.com/xuxueli/xxl-job/issues/1951
    accessToken: ${XXL_JOB_ACCESS_TOKEN:}
    # 注册地址
    admin:
      addresses: ${XXL_JOB_ADMIN_ADDRESSES:http://127.0.0.1:8080/xxl-job-admin}
    # 注册执行器
    executor:
      #  执行器注册 [选填]：优先使用该配置作为注册地址，为空时使用内嵌服务 ”IP:PORT“ 作为注册地址。从而更灵活的支持容器类型执行器动态IP和动态映射端口问题。
      address:
      appname: xxl-job-executor-sample
      # 执行器IP 配置为本机IP [选填]：默认为空表示自动获取IP，多网卡时可手动设置指定IP，该IP不会绑定Host仅作为通讯实用；地址信息用于 "执行器注册" 和 "调度中心请求并触发任务"；
      ip:
      # 执行器端口号 [选填]：小于等于0则自动获取；默认端口为9999，单机部署多个执行器时，注意要配置不同执行器端口；
      port: 9999
      # 执行器运行日志文件存储磁盘路径 [选填] ：需要对该路径拥有读写权限；为空则使用默认路径；
      logpath: ./data/applogs/xxl-job/jobhandler
      # 执行器日志文件保存天数 [选填] ： 过期日志自动清理, 限制值大于等于3时生效; 否则, 如-1, 关闭自动清理功能；
      logretentiondays: 30

# 日志
logging:
  level:
    root: info
    com.alibaba.nacos.client.logging.NacosLogging: error
  config: classpath:logback-spring.xml
