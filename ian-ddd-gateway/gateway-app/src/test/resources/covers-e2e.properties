# 分布式覆盖率采集配置（@CoversE2e）
#
# 优先级：系统属性 > 环境变量 > 本文件 > 默认值
# 控制器需先启动：mvn -f ddd-base/ian-ddd-coverage/coverage-controller/pom.xml spring-boot:run
coverage.controller.url=http://127.0.0.1:8099
# 参与采集的 Agent，与 coverage-controller 的 coverage.agents 名称对应；留空表示全部
coverage.agents=gateway,auth
# 控制器不可用或 Agent 不可达时是否让测试失败，默认 false（只告警）
coverage.fail-on-error=false
