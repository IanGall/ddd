server:
  port: 8092

spring:
  application:
    name: ian-ddd-gateway
  profiles:
    # 自动化测试请与认证服务一致地按「dev,autotest」顺序激活（网关本身不持有数据源）。
    active: dev

# 生产环境按部署约束保持 HTTP，渠道请求通过签名认证，不启用 TLS/mTLS。

dubbo:
  application:
    name: ian-ddd-gateway
    qos-enable: false
    metadata-type: remote
    metadata-service-protocol: tri
  consumer:
    check: false

  metrics:
    export-metrics-service: false

logging:
  level:
    root: info

management:
  endpoints:
    web:
      exposure:
        # 仅暴露探活；metrics 等内部端点不对外暴露（网关为公网入口）
        include: health
